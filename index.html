<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Counter и Лото</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- COUNTER -->
    <div class="counter">
        <h1>Счётчик</h1>

        <div id="count">0</div>

        <div class="buttons">
            <button id="increase">Увеличить</button>
            <button id="reset">Сбросить</button>
            <button id="decrease">Уменьшить</button>
        </div>
    </div>

    <!-- LOTTO -->
    <div class="lotto">
        <h1>Лото</h1>

        <div id="lottoNumbers"></div>

        <button id="generate">Сгенерировать</button>
    </div>

    <script src="script.js"></script>
</body>
</html>
